<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearthfall</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #7fb6e8; font-family: system-ui, sans-serif; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #editor { position: fixed; left: 12px; top: 12px; z-index: 5; }
      #replay { position: fixed; left: calc(50% + 50px * var(--hud-scale, 1)); top: calc(202px * var(--hud-scale, 1)); transform: translateX(-50%); z-index: 5; }
      #replay > .menu-panel { zoom: var(--hud-scale, 1); }
      /* M11: boot screen until the first frame and the models are in; fatal panel; non-blocking notice */
      #boot, #fatal { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 40%, #2b2440 0%, #120f1c 70%); color: #f1e4c8; z-index: 20; }
      #boot h1, #fatal h1 { margin: 0; font: 700 44px/1 Georgia, serif; letter-spacing: 3px; color: #f6c76a; text-shadow: 0 3px 0 #5a3412; }
      #boot p, #fatal p { margin: 0; font-size: 15px; opacity: 0.85; max-width: 560px; text-align: center; }
      #boot .bar { width: 220px; height: 8px; border: 2px solid #8a6a3c; border-radius: 6px; overflow: hidden; background: #2a2016; }
      #boot .bar i { display: block; height: 100%; width: 40%; background: #f6c76a; animation: boot 1.2s ease-in-out infinite alternate; }
      @keyframes boot { from { margin-left: 0; } to { margin-left: 60%; } }
      #fatal { display: none; z-index: 30; }
      #fatal code { font-size: 13px; color: #ffb59a; max-width: 720px; word-break: break-word; text-align: center; }
      #notice { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); display: none; padding: 8px 14px; background: #2a2016ee; border: 2px solid #8a6a3c; border-radius: 6px; color: #f1e4c8; font-size: 14px; z-index: 25; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="menus"></div>
    <div id="editor"></div>
    <div id="replay"></div>
    <div id="boot"><h1>HEARTHFALL</h1><p>Shaping the world...</p><div class="bar"><i></i></div></div>
    <div id="fatal"><h1>HEARTHFALL</h1><p id="fatal-why">The game could not start.</p><code id="fatal-msg"></code></div>
    <div id="notice"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
